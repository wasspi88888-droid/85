<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#FF6B35" flood-opacity="0.18" />
    </filter>
  </defs>
  <!-- White Background with gentle rounded rect -->
  <rect width="512" height="512" rx="128" fill="#FFFFFF" />
  <rect width="504" height="504" x="4" y="4" rx="124" fill="none" stroke="#F3F4F6" stroke-width="8" />
  
  <!-- 85 in Futuristic Style (Orbitron aesthetic) -->
  <text x="256" y="325" 
        font-family="'Orbitron', -apple-system, sans-serif" 
        font-weight="900" 
        font-size="220" 
        text-anchor="middle" 
        fill="#FF6B35" 
        letter-spacing="-12">85</text>
        
  <!-- Subtle tech dot accents -->
  <circle cx="410" cy="140" r="10" fill="#FF6B35" opacity="0.8" />
  <circle cx="102" cy="372" r="8" fill="#FF6B35" opacity="0.6" />
</svg>
